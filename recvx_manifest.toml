# Manual correction for the first runtime bctr trap in sub_822E5280.
# Guest PPC at 0x822E5298..0x822E52A4 is:
#   slwi r6, r8, 2
#   lwzx r5, r6, r7
#   mtctr r5
#   bctr
# r7 is the table base (0x82CB6128), not the switch index. The actual
# zero-based index is r8. The 120-entry table at 0x82CB6128 contains
# 0x822E52A8 in every slot. ReXGlue auto-detected the labels correctly but
