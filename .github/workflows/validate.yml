name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python scripts
        run: python3 -m compileall -q scripts

      - name: Validate shell scripts when present
        shell: bash
        run: |
          shopt -s nullglob
          files=(build.sh run.sh test-boot.sh gdb.sh scripts/*.sh)
          if (("${#files[@]}")); then
            bash -n "${files[@]}"
          fi

      - name: Check build helper references
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path(".")
          build = (root / "build.sh").read_text(encoding="utf-8")
          common = root / "scripts/common.sh"
          assert common.is_file(), "build.sh requires missing scripts/common.sh"

          # Extract project-local helper paths declared in readonly variables.
          refs = re.findall(r'readonly [A-Z0-9_]+="\\$ROOT_DIR/([^"]+)"', build)
          missing = [name for name in refs if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing build helpers: " + ", ".join(missing))
          print(f"Build entrypoint helper references: OK ({len(refs)} files)")
          PY

      - name: Validate project manifest
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          manifest = pathlib.Path("recvx_manifest.toml")
          data = tomllib.loads(manifest.read_text(encoding="utf-8"))
          assert data["project"]["name"] == "recvx"
          assert data["entrypoint"]["file_path"] == "game/Default.xex"
          assert data["entrypoint"]["out_directory_path"] == "generated/default"
          assert data["entrypoint"]["functions"], "Expected at least one function boundary"
          print("Manifest TOML and required target fields: OK")
          PY

      - name: Check repository safety rules
        run: |
          test ! -e game/Default.xex
          if git ls-files | grep -Ei '(^|/)(Default\.xex|.*\.(iso|xiso|wud|wad))$'; then
            echo "Retail game files must not be tracked." >&2
            exit 1
          fi
